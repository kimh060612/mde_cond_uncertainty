dataset:
  name: ati_dataset
  dataset_root: /datasets/ATI/MDE/orbbec_realworld_dataset
  csv_path: /home/kimh060612/ati_workspace/mde_cond_uncertainty/orbbec_canonical_parameter_frame_matches_by_scene/
  min_depth: 1e-3
  max_depth: 10.0
  min_valid_depth_ratio: 0.9
  min_registration_overlap_ratio: 0.95
  min_registration_ecc_score: 0.97
  max_pair_time_diff_sec: 0.05
  max_registration_translation_px: 32.0
  abs_rel_degradation_quantile: 0.99
  include_canonical_setting_as_candidate: true
  output_dir: ./da2_ati_cond_uncertainty_ckpt
  num_workers: 8
  exposure_min: 4000
  exposure_max: 32000
  gain_min: 16
  gain_max: 128
  train_topologies:
    - "topology1"
    - "topology3"
    - "topology4"
  seen_val_topologies:
    - "topology1"
    - "topology3"
    - "topology4"
  unseen_val_topologies:
    - "topology2"
    - "topology5"

model:
  model_id: "small"
  method: "tta" # gradient
  camera_model_name: "Orbbec-Gemini-336L"
  image_height: 518
  image_width: 518

pairwise_policy:
  m_switch: 0.01
  beta: 0.07
  train_tie_eps_percent: 3.0
  eval_tie_eps_percent: [3.0, 5.0, 10.0]
  loss_weight: 0.1
  detach_pair_std: true

evaluation:
  csv_path: /home/kimh060612/ati_workspace/mde_cond_uncertainty/orbbec_canonical_parameter_frame_matches_by_scene
  dataset_root: /datasets/ATI/MDE/orbbec_realworld_dataset
  min_camera_settings: 10
  relative_regret_thresholds_percent: [5.0, 10.0, 15.0]
  alpha_sweep_values: [0.0, 0.1, 0.3, 0.5, 0.7, 1.0]
  inference_batch_size: 8
  method: "tta" # gradient
  output_dir: ./selection_evaluation_comparison
  pairwise_beta_sweep:
    min: 0.0
    max: 2.326
    num_points: 201
    selection_split: seen
    objective: accuracy
