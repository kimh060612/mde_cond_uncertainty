dataset:
  name: ati_dataset
  dataset_root: /datasets/ATI/MDE/orbbec_realworld_dataset
  csv_path: /home/kimh060612/ati_workspace/mde_cond_uncertainty/orbbec_canonical_parameter_frame_matches_by_scene/
  min_depth: 1e-3
  max_depth: 10.0
  min_valid_depth_ratio: 0.9
  min_registration_overlap_ratio: 0.95
  min_registration_ecc_score: 0.97
  max_pair_time_diff_sec: 0.05
  max_registration_translation_px: 32.0
  abs_rel_degradation_quantile: 0.99
  include_canonical_setting_as_candidate: true
  output_dir: ./da2_ati_cond_uncertainty_ckpt
  num_workers: 8
  exposure_min: 4000
  exposure_max: 32000
  gain_min: 16
  gain_max: 128
  train_topologies:
    - "topology1"
    - "topology3"
    - "topology5
  seen_val_topologies:
    - "topology1"
    - "topology3"
    - "topology4"
  unseen_val_topologies:
    - "topology2"
    - "topology4"

model:
  model_id: "small"
  image_height: 518
  image_width: 518

training:
  seed: 2026
  batch_size: 32
  num_epochs: 50
  lr_finetune: 1e-4
  weight_decay: 1e-4
  relative_align_mode: scale_shift
  wandb_entity: artificial_tripartite_intelligence_team
  wandb_project: mde_uncertainty_measure
  wandb_name: dav2_cond_uncertainty
  lr_scheduler_monitor: abs_rel
  lr_scheduler_factor: 0.5
  lr_scheduler_patience: 1
  lr_scheduler_threshold: 1e-4
  lr_scheduler_cooldown: 0
  lr_scheduler_min_lr_ratio: 0.05

evaluation:
  output_csv: ./comparison_ae/metric3dv2.csv
  batch_size: 4
  metric3d_model_id: JUGGHM/Metric3D
  metric3d_model: metric3d_vit_small
  # Focal length in pixels after resizing to model.image_height/image_width.
  metric3d_focal_length: 1000.0
